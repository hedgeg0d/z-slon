[package]
name = "z-slon"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "z-slon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustyline = "14"
clap = { version = "4", features = ["derive"] }
nnue-rs = "0.3.1"
polyglot-book-rs = "0.1.0"
lazy_static = "1.5"
